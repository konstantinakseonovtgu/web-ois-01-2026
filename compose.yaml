services:
  api:
    build: ./api
    image: web-ois-api:local
    container_name: web-ois-api
    working_dir: /app
    command: fastapi dev app/main.py --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    env_file: .env

  db:
    image: postgres:18
    container_name: web-ois-db
    command: postgres -c timezone=Asia/Tomsk
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webois -d webois"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./web
    image: web-ois-web:local
    container_name: web-ois-web
    command: npx nuxt dev --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.nuxt
    env_file: .env
    depends_on:
      - api

volumes:
  db-data: