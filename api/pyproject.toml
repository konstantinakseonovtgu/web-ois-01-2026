[project]
name = "web-ois-api"
version = "0.4.0"
description = "API студ афиши"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi[standard]==0.143.0",
    "pedantic==3.0.5",
    "psycopg[binary]>=3.3.6",
    "sqladmin>=0.32.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "itsdangerous>=2.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
